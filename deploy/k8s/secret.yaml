# ⚠️ 占位 secret —— 部署前必须替换，或用下面的命令直接创建（推荐，不落盘到仓库）。
#
#   kubectl -n multi-agent-platform create secret generic multi-agent-platform \
#     --from-literal=LLM_ENDPOINT='https://your-llm-endpoint/v1' \
#     --from-literal=LLM_API_KEY='sk-xxx' \
#     --from-literal=LLM_MODEL='deepseek-v4-flash'
#
# 真实 LLM 接入为必需；若仅做离线评估，可将下方 LLM_USE_MOCK 置为 "true"（见 configmap）。
apiVersion: v1
kind: Secret
metadata:
  name: multi-agent-platform
  namespace: multi-agent-platform
  labels:
    app.kubernetes.io/part-of: multi-agent-platform
type: Opaque
stringData:
  LLM_ENDPOINT: "REPLACE_ME_endpoint"
  LLM_API_KEY: "REPLACE_ME_api_key"
  LLM_MODEL: "REPLACE_ME_model"
  # 可选：/metrics 鉴权 token；为空则不鉴权。
  METRICS_TOKEN: ""
