name: CI

on:
  push:
    branches: [main]
  pull_request:

# 并发控制：同一 ref 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端构建（go:embed 依赖）：构建 web + web/v2 的 dist，作为 artifact 供其余 job 复用。
  # 没有这一步，go build / go test 会因 //go:embed dist 找不到文件而失败。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web (v1)
        run: |
          cd web && npm ci && npm run build

      - name: Build web/v2 (default UI)
        run: |
          cd web/v2 && npm ci && npm run build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            web/dist
            web/v2/dist
          if-no-files-found: error

  # 快门禁：每次 push/PR 都跑，无前端、无网络、无需 API key（前端由 frontend job 提供）。
  # gofmt 当前为 warn-only（internal/cmd/pkg 有 125 个存量文件未格式化），
  # 待团队执行一次 `make fmt` 并提交后，可把 format 步骤改为阻断（去掉 continue-on-error）。
  go-ci:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .

      - name: Format check (report only)
        continue-on-error: true
        run: |
          unformatted=$(gofmt -l internal cmd pkg)
          if [ -n "$unformatted" ]; then
            echo "::warning::以下文件未通过 gofmt（共 $(echo "$unformatted" | wc -l | tr -d ' ') 个），建议本地执行 make fmt："
            echo "$unformatted"
          else
            echo "gofmt clean ✓"
          fi

      - name: go vet
        run: go vet ./...

      # -short 跳过依赖真实外网/真实 API key 的测试（见 internal/tool/
      # network_test_guard_test.go）。这类测试在 CI runner 上不具确定性：
      # 受第三方站点可用性、地域网络策略与反爬策略影响。
      # 本地手动验证：RUN_NETWORK_TESTS=1 go test ./internal/tool/ -run TestReal -v
      - name: go test
        run: go test -short ./...

      - name: go build
        run: go build -o bin/server ./cmd/server

  # 确定性 21 case 回归（mock，无需 API key）。
  # 复用现有 scripts/cases-regression.sh；需要 Go + Node(WS 订阅) + Python(JSON 解析)。
  regression-mock:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .

      - name: Run case regression (mock)
        run: |
          PYTHONUTF8=1 LLM_USE_MOCK=true bash scripts/cases-regression.sh

  # 并发安全门禁（N3-04b，E7）：在具备 gcc 的 Linux runner 上跑 race detector，
  # 捕获 ws / runtime / orchestrator / tool 等共享临界区的 data race。
  # ① 单元/集成测试 go test -race（覆盖各包并发路径）；
  # ② 用 -race 编译 server 并跑 21 case mock 回归，在真实多 Agent 负载下再捕一轮。
  # -short 跳过依赖真实外网/API key 的测试，保持 CI 确定性。
  race:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: .

      - name: go test -race (unit/integration)
        run: go test -race -short ./...

      - name: case regression under -race
        env:
          BUILD_FLAGS: '-race'
        run: |
          PYTHONUTF8=1 LLM_USE_MOCK=true bash scripts/cases-regression.sh
